name: AmplifySwiftReproLab
options:
  createIntermediateGroups: true
packages:
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    from: 2.58.1
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  AmplifySwiftReproLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.amplifyswiftreprolab
        PRODUCT_NAME: AmplifySwiftReproLab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Amplify
        product: Amplify
      - package: Amplify
        product: AWSCognitoAuthPlugin
      - package: Amplify
        product: AWSAPIPlugin
    preBuildScripts:
      - name: Copy amplify_outputs.json
        script: |
          set -euo pipefail
          SOURCE_FILE="${PROJECT_DIR}/../amplify_outputs.json"
          DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST_FILE="${DEST_DIR}/amplify_outputs.json"

          if [ ! -f "${SOURCE_FILE}" ]; then
            echo "error: Missing amplify_outputs.json at ${SOURCE_FILE}. Run 'npx ampx sandbox' from the repo root first."
            exit 1
          fi

          mkdir -p "${DEST_DIR}"
          cp "${SOURCE_FILE}" "${DEST_FILE}"
        inputFiles:
          - $(PROJECT_DIR)/../amplify_outputs.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/amplify_outputs.json
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AmplifySwiftReproLab
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: amplify-swift-repro-lab
            CFBundleURLSchemes:
              - amplifyswiftreprolab
scheme:
  gatherCoverageData: false
